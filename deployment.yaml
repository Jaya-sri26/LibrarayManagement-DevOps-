apiVersion: apps/v1
kind: Deployment

metadata:
  name: library-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: library-app

  template:
    metadata:
      labels:
        app: library-app

    spec:
      containers:
      - name: library-app

        image: jaya02sri26/library:latest

        ports:
        - containerPort: 5001